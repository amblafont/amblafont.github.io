<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Redirect to the new location while keeping query parameters
        // Example: If current is example.com/old.html?user=1,
        // it redirects to example.com/new.html?user=1
        window.location.replace("../graph-editor-web/index.html" + window.location.search);
    </script>
</head>
<body>
	Redirecting...
</body>
</html>
